# Exported to the public pyfylr repository as .github/workflows/release-pypi.yml.
# Trusted Publishing uses the GitHub environment name below. There is no
# API token and no password input. A push does not run this workflow.
name: release-pypi

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      testpypi:
        description: Upload the artifacts to TestPyPI
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build_sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build the sdist and check it
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build==1.3.3" "twine==6.2.0"
          python -m build --sdist --outdir dist
          twine check dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pyfylr-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build_wheels:
    needs: build_sdist
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub-hosted labels, docs.github.com runners reference:
          # macos-15-intel is Intel x86_64; macos-15 is arm64.
          - os: ubuntu-latest
            arch: x86_64
          - os: macos-15-intel
            arch: x86_64
          - os: macos-15
            arch: arm64
          - os: windows-latest
            arch: auto64
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pyfylr-sdist
          path: sdist-artifact
      - name: Unpack the sdist
        shell: bash
        run: |
          mkdir -p sdist-root
          tar -xzf sdist-artifact/*.tar.gz -C sdist-root --strip-components=1
          test -f sdist-root/pyproject.toml
          test -f sdist-root/CMakeLists.txt
          test -f sdist-root/tests/wheel_check.py
          test -f sdist-root/tests/test_release_wheel.py
      # Wheels are built from that unpacked sdist, not from the git checkout.
      # CMakeLists.txt in the sdist applies the same flags as the sdist build:
      # GCC and Clang get -fno-fast-math -ffp-contract=off -O2.
      # MSVC gets /O2 and is not given /fp:fast. tests/test_release_wheel.py
      # reads build_info()["flags"] and checks that path.
      - name: Build wheels
        uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        env:
          CIBW_BUILD: cp311-* cp312-* cp313-*
          CIBW_SKIP: "*-musllinux_* pp*"
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=11.0
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: python {package}/tests/wheel_check.py
        with:
          package-dir: sdist-root
          output-dir: wheelhouse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pyfylr-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    needs: [build_sdist, build_wheels]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pyfylr-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  publish_testpypi:
    needs: [build_sdist, build_wheels]
    if: github.event_name == 'workflow_dispatch' && inputs.testpypi
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pyfylr-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
