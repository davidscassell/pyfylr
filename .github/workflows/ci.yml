name: test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the build frontend
        run: python -m pip install --upgrade pip build
      - name: Build the sdist
        run: python -m build --sdist --outdir "${RUNNER_TEMP}/sdist" .
      - name: Build a wheel from the unpacked sdist
        run: |
          rm -rf "${RUNNER_TEMP}/src"
          mkdir -p "${RUNNER_TEMP}/src"
          tar -xzf "${RUNNER_TEMP}/sdist"/pyfylr-*.tar.gz -C "${RUNNER_TEMP}/src"
          python -m build --wheel --outdir "${RUNNER_TEMP}/wheel" "${RUNNER_TEMP}/src"/pyfylr-*
      - name: Install the wheel outside the checkout
        run: |
          python -m venv "${RUNNER_TEMP}/venv"
          "${RUNNER_TEMP}/venv/bin/pip" install "${RUNNER_TEMP}/wheel"/*.whl matplotlib seaborn "scikit-learn>=1.3" pytest
          "${RUNNER_TEMP}/venv/bin/python" -c 'import pyfylr,inspect; print(inspect.getfile(pyfylr))'
      - name: Run pytest against that install
        run: |
          env -u PYTHONPATH "${RUNNER_TEMP}/venv/bin/python" -m pytest tests -q --tb=line
